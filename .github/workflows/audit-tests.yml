name: Audit Tests

on:
  push:
    branches: [tests]
  pull_request:
    branches: [main, tests]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: requirements-test.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest iterfzf==1.8.0.62.0

      - name: Run tests with verbose output and save to file
        run: |
          pytest tests/ -vv --tb=long 2>&1 | tee test-output.log

      - name: Upload test logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-python-${{ matrix.python-version }}
          path: test-output.log
          retention-days: 7
