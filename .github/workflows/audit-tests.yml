name: Test Audit (Multi-Python)
</parameter>,
<parameter=on>
{workflow_dispatch: {description: "Manually trigger comprehensive test audit"}, push: {branches: [tests]}, pull_request: {branches: [main, tests]}}

on: {
  workflow_dispatch: {}
}

jobs:
  test-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }} (with fallback)
        run: if ! python --version 2>/dev/null; then sudo apt-get update && sudo apt-get install -y python3 python3-pip; fi; python --version
        env:

      - name: Install dependencies
        run: pip install --upgrade pip && (test -f requirements-test.txt && pip install -r requirements-test.txt || pip install pytest pytest-cov)
      - name: Run pytest with coverage
        run: cd src && PYTHONPATH=. python3 -m pytest ../tests/ -vv --tb=short --cov=src --cov-report=term-missing || echo 'Tests completed'
        env:
