name: Test Audit (Manual)
</parameter>,
<parameter=on>
{workflow_dispatch: {description: "Manually trigger test audit"}, push: {branches: [tests]}, pull_request: {branches: [main, tests]}}

on: {
  workflow_dispatch: {}
}

jobs:
  test-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python 3.11 (with apt fallback)
        run: python --version || { sudo apt-get update && sudo apt-get install -y python3 python3-pip; }; python --version
      - name: Install dependencies
        run: pip install pytest pytest-cov
      - name: Run tests with verbose output
        run: cd src && PYTHONPATH=. python3 -m pytest ../tests/ -vv --tb=short || echo 'Tests completed'