name: Tests

on:
  push:
    branches: [tests]
  pull_request:
    branches: [main, tests]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-test.txt ]; then
            pip install -r requirements-test.txt
          fi
      
      - name: List files in src directory for debugging
        run: |
          echo "Files in src/:"
          ls -la src/
      
      - name: List files in tests directory for debugging  
        run: |
          echo "Files in tests/:"
          ls -la tests/
      
      - name: Check pytest installation
        run: |
          python -m pytest --version
      
      - name: Run only simple test first
        run: |
          python -m pytest tests/test_simple.py -v --tb=short
      
      - name: List Python path and check imports
        run: |
          python -c "import sys; print('\n'.join(sys.path))"
