name: Tests

on:
  push:
    branches: [tests]
  pull_request:
    branches: [main, tests]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-test.txt ]; then
            pip install -r requirements-test.txt
          fi
      
      - name: List tests directory structure
        run: |
          echo "=== Tests Directory ==="
          find tests/ -type f -name "*.py" | sort
          echo "=== Source Directory Structure ==="  
          find src/ -type f -name "*.py" | sort
      
      - name: Test basic Python import capability
        run: |
          python --version
          pip install pytest
      
      - name: Run simple test to verify environment
        run: |
          echo "Running simple assertion test..."
          python -c "assert 1 + 1 == 2"
          echo "Simple test passed!"
      
      - name: List all Python files in tests/
        run: |
          ls -la tests/*.py
      
      - name: Run pytest with verbose output on ALL tests
        id: pytest_debug
        continue-on-error: true
        run: |
          set +e  # Don't exit on error, capture all output
          python -m pytest tests/ -v --tb=long 2>&1 || echo "PYTEST FAILED"
